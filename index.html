

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد | موقعي الأول</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            transition: background 0.5s ease;
        }

        header {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            font-size: 20px;
        }

        .container {
            margin-top: 60px;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }

        img {
            width: 150px;
            border-radius: 50%;
            margin-top: 20px;
            border: 3px solid white;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #00c6ff;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #0072ff;
            transform: scale(1.1);
        }

        .about {
            margin-top: 40px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            max-width: 300px;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <header>
        🌐 موقعي على الإنترنت
    </header>

    <div class="container">
        <h1>🚀 أهلاً وسهلاً</h1>
        <p>أنا محمد أتعلم البرمجة والكلاود</p>

        <!-- صورة -->
        <img src="https://via.placeholder.com/150" alt="صورتي">

        <!-- زر -->
        <br>
        <button onclick="changeColor()">غيّر الخلفية</button>

        <!-- قسم من أنا -->
        <div class="about">
            <h3>👨‍💻 من أنا؟</h3>
            <p>
                انا محمد سعيد اتعلم الان  الكلاود وأسعى أصير مطور محترف 🚀
            </p>
        </div>
    </div>

    <footer>
        © 2026 محمد - جميع الحقوق محفوظة
    </footer>

    <script>
        function changeColor() {
            const colors = [
                "linear-gradient(to right, #ff7e5f, #feb47b)",
                "linear-gradient(to right, #43cea2, #185a9d)",
                "linear-gradient(to right, #ff512f, #dd2476)",
                "linear-gradient(to right, #00c6ff, #0072ff)"
            ];

            let randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.background = randomColor;
        }
    </script>

</body>
</html>
